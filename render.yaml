services:
  - type: web
    name: jennifer-proxy
    runtime: node
    region: oregon
    plan: free
    startCommand: ./start-render.sh
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: JENNIFER_SYSTEM_PROMPT_PATH
        value: ./jennifer-system-prompt.txt
      - key: LEAD_SUMMARY_ENABLED
        value: "0"
      - key: ENABLE_IMESSAGE
        value: "0"
      - key: LEAD_TEXT_DELAY_MS
        value: "240000"
      - key: OLLAMA_HOST
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: qwen3:8b
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PUSHOVER_API_TOKEN
        sync: false
      - key: PUSHOVER_USER_KEY
        sync: false
      - key: PUSHOVER_DEVICE
        sync: false
